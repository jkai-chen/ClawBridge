name: CI
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  # The Go suites run as parallel jobs; `linux`, the check the ruleset
  # requires, passes only when all of them pass. Test results are never
  # cached (-count=1); only modules and build output are, keyed on go.sum.
  test:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      # The release builder probes run once, in checks: they build in a
      # subprocess, so neither -race nor this job's load adds anything.
      - name: Full tests with real disposable PostgreSQL
        run: bash integration/run-postgres.sh go test ./... -skip '^TestReleaseBuilder' -count=1 -timeout 25m
  # internal/bus and integration are most of the race run (17 and 11 minutes
  # alone), so each is split in 3 by test name (scripts/go_test_shard.py: sorted,
  # dealt out in turn, disjoint and complete); every other package runs in
  # one job.
  race:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: bus 1/3, package: ./internal/bus, shard: 1, of: 3}
          - {name: bus 2/3, package: ./internal/bus, shard: 2, of: 3}
          - {name: bus 3/3, package: ./internal/bus, shard: 3, of: 3}
          - {name: integration 1/3, package: ./integration, shard: 1, of: 3}
          - {name: integration 2/3, package: ./integration, shard: 2, of: 3}
          - {name: integration 3/3, package: ./integration, shard: 3, of: 3}
          - {name: the rest, package: rest}
    name: race (${{ matrix.name }})
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true
          # Its own key, go.sum with go.mod, so race builds don't share the
          # plain build's cache entry.
          cache-dependency-path: |
            go.sum
            go.mod
      - name: Race tests with real disposable PostgreSQL
        env:
          PACKAGE: ${{ matrix.package }}
          SHARD: ${{ matrix.shard }}
          OF: ${{ matrix.of }}
        run: |
          set -euo pipefail
          if [ "$PACKAGE" = rest ]; then
            # Every package but the split ones; the list is checked to be
            # non-empty and to leave nothing else out.
            go list ./... | grep -v -x -e clawbridge/internal/bus -e clawbridge/integration > packages.txt
            test "$(wc -l < packages.txt)" -eq "$(( $(go list ./... | wc -l) - 2 ))"
            bash integration/run-postgres.sh go test -race $(cat packages.txt) -count=1 -timeout 25m
          else
            go test -race -list . "$PACKAGE" > tests.txt
            run="$(python3 scripts/go_test_shard.py "$SHARD" "$OF" < tests.txt)"
            bash integration/run-postgres.sh go test -race "$PACKAGE" -run "$run" -skip '^TestReleaseBuilder' -count=1 -timeout 25m
          fi
  checks:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      # The message queue's chaos cases (crashes, a killed LISTEN, a network
      # stall, a compaction); the 10k soak runs in chaos.yml.
      - name: Message queue chaos cases with real disposable PostgreSQL
        run: bash integration/run-postgres.sh go test -tags chaos ./internal/server -run '^TestChaos' -short -count=1 -timeout 10m
      # The release builder probes cross-build in a subprocess, so they run
      # here, once, without -race and away from the PG suites' load; the
      # step fails unless both ran and passed.
      - name: Release builder probes
        run: |
          set -euo pipefail
          go test ./integration -run '^TestReleaseBuilder' -count=1 -v -timeout 15m | tee release-probes.txt
          grep -q '^--- PASS: TestReleaseBuilderIndependent ' release-probes.txt
          grep -q '^--- PASS: TestReleaseBuilderRejectsExternalSourceOverrides ' release-probes.txt
      - run: go vet ./...
      - run: python3 scripts/test_install.py
      - run: python3 scripts/test_release.py
      - run: python3 scripts/test_publish.py
      - run: python3 scripts/test_shard.py
      - run: bash -n scripts/build-release.sh scripts/publish-release.sh
      - run: sh -n scripts/install.sh
      - run: sh -n deploy/agentd-check.sh deploy/agentd-check-test.sh
      # agentd's install check, against a correct install and each break,
      # in a disposable container (it creates users).
      - run: docker run --rm -v "$PWD/deploy:/deploy:ro" debian:bookworm-20261005-slim@sha256:7c7b2c966bc9ee8cedfeef67e0e279108992c77681fa595db4a9d65c06ccc587 sh /deploy/agentd-check-test.sh
  # The required check: green only when every Go job above is.
  linux:
    if: ${{ always() && github.event.repository.private == false }}
    needs: [test, race, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every Go job passed
        env:
          RESULTS: ${{ needs.test.result }} ${{ needs.race.result }} ${{ needs.checks.result }}
        run: |
          echo "test, race, checks: $RESULTS"
          for r in $RESULTS; do
            [ "$r" = success ] || { echo "::error::a Go job did not pass ($RESULTS)"; exit 1; }
          done
  dispatcher-agent:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dispatcher-agent
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.20.0
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run check:schema
      # The model hints setup shows come from the pinned pi-ai's catalogue.
      - run: npm run check:models
      - run: npm run check:lock
      - run: npm audit --omit=dev --audit-level=high
      # No provider keys exist in this workflow; the tests use local fakes only.
      - run: npm test
  agentd-image:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      # The egress container's image, run with the fixed spec's hardening.
      - run: bash cmd/clawbridge-agentd/scripts/image-test.sh
  dispatcher-agent-container:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: dispatcher-agent
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.20.0
      - run: npm ci --ignore-scripts
      # 1,000 cases in the hardened image: memory under 160 MiB, no egress beyond loopback, hardening in place.
      - run: bash scripts/container-test.sh
  macos-installer:
    if: ${{ github.event.repository.private == false }}
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: python3 scripts/test_install.py
  windows-installer:
    if: ${{ github.event.repository.private == false }}
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Native Windows Linear profile privacy regressions
        shell: pwsh
        run: go test ./internal/linearconn -run "^TestLinear(ProfileArtifactsUsePlatformPrivacy|ProfileStorageRejectsFinalDirectoryAndFileSymlinks|WindowsExistingUnsafeACLIsRefusedWithoutRepair)$" -count=1
      - name: Independent native Windows Linear profile ACL regression
        shell: pwsh
        run: go test ./integration -run '^TestL1ProfileWindowsExplicitACLCreateReloadAndRejectBroadFile$' -count=1
      - name: Native Windows CLI-owned stdin regressions
        shell: pwsh
        run: go test ./internal/cli -run '^TestLinearImportReader' -count=1
      # Each step from here reports on its own; the job still fails if any does.
      - name: Guided setup typed into a real Windows console (ConPTY)
        if: ${{ !cancelled() }}
        shell: pwsh
        run: go test ./integration -run '^TestWindowsGuidedSetupConsoleInput$' -count=1 -v
      - name: Windows PowerShell 5.1 installer fixtures
        if: ${{ !cancelled() }}
        shell: powershell
        run: .\scripts\test_install.ps1
      - name: PowerShell 7 installer fixtures
        if: ${{ !cancelled() }}
        shell: pwsh
        run: .\scripts\test_install.ps1
      - name: Independent Windows PowerShell 5.1 installer probes
        if: ${{ !cancelled() }}
        shell: powershell
        run: powershell -NoProfile -File integration/release_fixtures/install_windows_probe.ps1
      - name: Independent PowerShell 7 installer probes
        if: ${{ !cancelled() }}
        shell: pwsh
        run: pwsh -NoProfile -File integration/release_fixtures/install_windows_probe.ps1
      # Last, so a failure here never hides the installer and console steps.
      # Under the user profile, as for a real user: the runner's own TEMP is
      # outside it, with a different ACL.
      - name: Native Windows notify, setup and CLI tests under the user profile
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $env:TEMP = Join-Path $env:LOCALAPPDATA 'Temp'
          $env:TMP = $env:TEMP
          $null = New-Item -ItemType Directory -Force -Path $env:TEMP
          go test ./internal/notify ./internal/setup ./internal/cli -count=1
