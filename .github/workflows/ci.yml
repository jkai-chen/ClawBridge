name: CI
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
# A newer push to a pull request cancels its older run. Every other event
# (a push to main, a merge queue entry, a release's call, a manual run) has
# its own group, so it is never cancelled and never waits behind another.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # Which jobs a pull request needs, from the files it changes. Every other
  # event runs everything (full). A job skipped here reports "skipped",
  # which the ruleset counts as passing; `linux` fails if this job didn't
  # succeed, so a broken filter can't wave a pull request through.
  changes:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go: ${{ steps.scope.outputs.go }}
      node: ${{ steps.scope.outputs.node }}
      agentd: ${{ steps.scope.outputs.agentd }}
      macos: ${{ steps.scope.outputs.macos }}
      windows: ${{ steps.scope.outputs.windows }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        if: ${{ github.event_name == 'pull_request' }}
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != pull_request ]; then
            for k in go node agentd macos windows; do echo "$k=true" >> "$GITHUB_OUTPUT"; done
            exit 0
          fi
          git diff --name-only "$BASE" HEAD > changed.txt
          echo "Changed files:"; cat changed.txt
          python3 scripts/ci_scope.py < changed.txt >> "$GITHUB_OUTPUT"
  # The Go suites run as parallel jobs; `linux`, the check the ruleset
  # requires, passes only when all of them pass. Test results are never
  # cached (-count=1); only modules and build output are, keyed on go.sum.
  test:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      # The release builder probes run once, in checks: they build in a
      # subprocess, so neither -race nor this job's load adds anything.
      - name: Full tests with real disposable PostgreSQL
        run: bash integration/run-postgres.sh go test ./... -skip '^TestReleaseBuilder' -count=1 -timeout 25m
  # internal/bus and integration are most of the race run (17 and 11 minutes
  # alone), so each is split in 3 by test name (scripts/go_test_shard.py: sorted,
  # dealt out in turn, disjoint and complete); every other package runs in
  # one job.
  race:
    needs: changes
    if: ${{ github.event.repository.private == false && needs.changes.outputs.go == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: bus 1/3, package: ./internal/bus, shard: 1, of: 3}
          - {name: bus 2/3, package: ./internal/bus, shard: 2, of: 3}
          - {name: bus 3/3, package: ./internal/bus, shard: 3, of: 3}
          - {name: integration 1/3, package: ./integration, shard: 1, of: 3}
          - {name: integration 2/3, package: ./integration, shard: 2, of: 3}
          - {name: integration 3/3, package: ./integration, shard: 3, of: 3}
          - {name: the rest, package: rest}
    name: race (${{ matrix.name }})
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true
          # Its own key, go.sum with go.mod, so race builds don't share the
          # plain build's cache entry.
          cache-dependency-path: |
            go.sum
            go.mod
      - name: Race tests with real disposable PostgreSQL
        env:
          PACKAGE: ${{ matrix.package }}
          SHARD: ${{ matrix.shard }}
          OF: ${{ matrix.of }}
        run: |
          set -euo pipefail
          if [ "$PACKAGE" = rest ]; then
            # Every package but the split ones; the list is checked to be
            # non-empty and to leave nothing else out.
            go list ./... | grep -v -x -e clawbridge/internal/bus -e clawbridge/integration > packages.txt
            test "$(wc -l < packages.txt)" -eq "$(( $(go list ./... | wc -l) - 2 ))"
            bash integration/run-postgres.sh go test -race $(cat packages.txt) -count=1 -timeout 25m
          else
            go test -race -list . "$PACKAGE" > tests.txt
            run="$(python3 scripts/go_test_shard.py "$SHARD" "$OF" < tests.txt)"
            bash integration/run-postgres.sh go test -race "$PACKAGE" -run "$run" -skip '^TestReleaseBuilder' -count=1 -timeout 25m
          fi
  checks:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      # The message queue's chaos cases (crashes, a killed LISTEN, a network
      # stall, a compaction) and the zero-loss deploy's (a swap mid-send, a
      # drain then a swap, the client outbox); the 10k soak runs in chaos.yml.
      - name: Message queue chaos cases with real disposable PostgreSQL
        run: bash integration/run-postgres.sh go test -tags chaos ./internal/server -run '^TestChaos' -short -count=1 -timeout 10m
      # The release builder probes cross-build in a subprocess, so they run
      # here, once, without -race and away from the PG suites' load; the
      # step fails unless both ran and passed.
      - name: Release builder probes
        run: |
          set -euo pipefail
          go test ./integration -run '^TestReleaseBuilder' -count=1 -v -timeout 15m | tee release-probes.txt
          grep -q '^--- PASS: TestReleaseBuilderIndependent ' release-probes.txt
          grep -q '^--- PASS: TestReleaseBuilderRejectsExternalSourceOverrides ' release-probes.txt
      - run: go vet ./...
      # Cross-compile check for the windows/arm64 release asset.
      - run: GOOS=windows GOARCH=arm64 go vet ./...
      - run: python3 scripts/test_install.py
      - run: python3 scripts/test_release.py
      - run: python3 scripts/test_publish.py
      - run: python3 scripts/test_shard.py
      - run: python3 scripts/test_ci_scope.py
      - run: bash -n scripts/build-release.sh scripts/publish-release.sh scripts/check-image.sh
      - run: sh -n scripts/install.sh
      - run: sh -n deploy/agentd-check.sh deploy/agentd-check-test.sh deploy/local-host.sh deploy/backup-postgres.sh
      # shellcheck ships on ubuntu-latest.
      - run: shellcheck -s sh deploy/local-host.sh deploy/backup-postgres.sh
      # The local-host script end to end: it builds the server image, starts
      # shape A under a project of its own on loopback, backs up and uninstalls
      # with its data (opt-in elsewhere; about two minutes here). Then each
      # LAN Caddy service, for an IP address, with a client that sends no SNI.
      # The test's own deadlines (11 min, then 3 for teardown) sit inside
      # go test's 15, inside the step's 17, so its cleanup always runs.
      - name: Local host in Docker
        timeout-minutes: 17
        env:
          CLAWBRIDGE_TEST_DOCKER: "1"
        run: |
          set -euo pipefail
          go test ./integration -run '^(TestLocalHostDocker|TestLocalHostCaddyWithoutSNI)$' -count=1 -v -timeout 15m | tee local-host.txt
          grep -q '^--- PASS: TestLocalHostDocker ' local-host.txt
          grep -q '^--- PASS: TestLocalHostCaddyWithoutSNI ' local-host.txt
      # agentd's install check, against a correct install and each break,
      # in a disposable container (it creates users).
      - run: docker run --rm -v "$PWD/deploy:/deploy:ro" debian:bookworm-20261005-slim@sha256:7c7b2c966bc9ee8cedfeef67e0e279108992c77681fa595db4a9d65c06ccc587 sh /deploy/agentd-check-test.sh
  # Reachable vulnerabilities in the code and the Go standard library it is
  # built with, from the Go vulnerability database (it changes daily). The
  # tool is pinned; the job fails on a reachable finding. Not part of `linux`:
  # a new advisory must not block an unrelated pull request, and the release
  # runs the same check as its own gate.
  govulncheck:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: false
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
  # The required check: green only when the scope job and every Go job
  # above passed; race may be skipped only when the scope said no Go
  # changed (a docs-only pull request).
  linux:
    if: ${{ always() && github.event.repository.private == false }}
    needs: [changes, test, race, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every Go job passed
        env:
          SCOPE: ${{ needs.changes.result }}
          GO: ${{ needs.changes.outputs.go }}
          RESULTS: ${{ needs.test.result }} ${{ needs.checks.result }}
          RACE: ${{ needs.race.result }}
        run: |
          echo "changes: $SCOPE (go=$GO); test, checks: $RESULTS; race: $RACE"
          [ "$SCOPE" = success ] || { echo "::error::the scope job did not pass"; exit 1; }
          for r in $RESULTS; do
            [ "$r" = success ] || { echo "::error::a Go job did not pass ($RESULTS)"; exit 1; }
          done
          [ "$RACE" = success ] || { [ "$RACE" = skipped ] && [ "$GO" = false ]; } || { echo "::error::race did not pass ($RACE)"; exit 1; }
  dispatcher-agent:
    needs: changes
    if: ${{ github.event.repository.private == false && needs.changes.outputs.node == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dispatcher-agent
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.20.0
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run check:schema
      # The model hints setup shows come from the pinned pi-ai's catalogue.
      - run: npm run check:models
      - run: npm run check:lock
      - run: npm audit --omit=dev --audit-level=high
      # No provider keys exist in this workflow; the tests use local fakes only.
      - run: npm test
  agentd-image:
    needs: changes
    if: ${{ github.event.repository.private == false && needs.changes.outputs.agentd == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      # The egress container's image, run with the fixed spec's hardening.
      - run: bash cmd/clawbridge-agentd/scripts/image-test.sh
  agentd-rootless:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: false
      # agentd installed as docs/operations/agentd.md says, under a real
      # rootless daemon, against a fake server: no provider and no key.
      - name: Install agentd (setup.sh)
        run: sudo --preserve-env=GITHUB_ACTIONS,PATH bash integration/agentd-rootless/setup.sh
      - name: Probe the boundaries (probe.sh)
        run: sudo --preserve-env=GITHUB_ACTIONS,GITHUB_STEP_SUMMARY bash integration/agentd-rootless/probe.sh
      - name: Logs
        if: always()
        run: |
          sudo journalctl -u clawbridge-agentd -u clawbridge-agentd-proxy --no-pager -n 200 || true
          sudo journalctl _UID=$(id -u cbagent 2>/dev/null || echo 0) --no-pager -n 100 || true
          sudo cat /var/tmp/agentd-ci/fakelauncher.log || true
  dispatcher-agent-container:
    needs: changes
    if: ${{ github.event.repository.private == false && needs.changes.outputs.node == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: dispatcher-agent
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.20.0
      - run: npm ci --ignore-scripts
      # 1,000 cases in the hardened image: memory under 160 MiB, no egress beyond loopback, hardening in place.
      - run: bash scripts/container-test.sh
  # The server image as the release builds it, with no push: both bases are
  # index digests, and each platform's binary and base are that platform's.
  # It builds the server, so it runs for any change but docs.
  server-image:
    needs: changes
    if: ${{ github.event.repository.private == false && needs.changes.outputs.go == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - run: bash scripts/check-image.sh bases
      - run: bash scripts/check-image.sh arch
  macos-installer:
    needs: changes
    if: ${{ github.event.repository.private == false && needs.changes.outputs.macos == 'true' }}
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: python3 scripts/test_install.py
  windows-installer:
    needs: changes
    if: ${{ github.event.repository.private == false && needs.changes.outputs.windows == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Native Windows Linear profile privacy regressions
        shell: pwsh
        run: go test ./internal/linearconn -run "^TestLinear(ProfileArtifactsUsePlatformPrivacy|ProfileStorageRejectsFinalDirectoryAndFileSymlinks|WindowsExistingUnsafeACLIsRefusedWithoutRepair)$" -count=1
      - name: Independent native Windows Linear profile ACL regression
        shell: pwsh
        run: go test ./integration -run '^TestL1ProfileWindowsExplicitACLCreateReloadAndRejectBroadFile$' -count=1
      - name: Native Windows CLI-owned stdin regressions
        shell: pwsh
        run: go test ./internal/cli -run '^TestLinearImportReader' -count=1
      - name: Native Windows self-update (rename a running binary aside)
        shell: pwsh
        run: go test ./internal/selfupdate -count=1
      # Each step from here reports on its own; the job still fails if any does.
      - name: Guided setup typed into a real Windows console (ConPTY)
        if: ${{ !cancelled() }}
        shell: pwsh
        run: go test ./integration -run '^TestWindowsGuidedSetupConsoleInput$' -count=1 -v
      - name: Windows PowerShell 5.1 installer fixtures
        if: ${{ !cancelled() }}
        shell: powershell
        run: .\scripts\test_install.ps1
      - name: PowerShell 7 installer fixtures
        if: ${{ !cancelled() }}
        shell: pwsh
        run: .\scripts\test_install.ps1
      - name: Independent Windows PowerShell 5.1 installer probes
        if: ${{ !cancelled() }}
        shell: powershell
        run: powershell -NoProfile -File integration/release_fixtures/install_windows_probe.ps1
      - name: Independent PowerShell 7 installer probes
        if: ${{ !cancelled() }}
        shell: pwsh
        run: pwsh -NoProfile -File integration/release_fixtures/install_windows_probe.ps1
      # The last two steps, so a failure there never hides the installer and
      # console steps.
      # Under the user profile, as for a real user: the runner's own TEMP is
      # outside it, with a different ACL.
      - name: Native Windows notify, setup, CLI and ctxwatch tests under the user profile
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $env:TEMP = Join-Path $env:LOCALAPPDATA 'Temp'
          $env:TMP = $env:TEMP
          $null = New-Item -ItemType Directory -Force -Path $env:TEMP
          go test ./internal/notify ./internal/setup ./internal/cli ./internal/ctxwatch -count=1
      # Also under the user profile, for the same reason.
      - name: Native Windows Codex wake-up adapter with a Go-built fake
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $env:TEMP = Join-Path $env:LOCALAPPDATA 'Temp'
          $env:TMP = $env:TEMP
          $null = New-Item -ItemType Directory -Force -Path $env:TEMP
          go test ./integration -run '^TestNotificationCodexFakeSubprocess$' -count=1
  # Native Windows on ARM (GitHub's hosted windows-11-arm runner for public repos).
  # If the label is wrong or the runner is unavailable the job fails or stays queued
  # and shows up red or pending; it is never skipped silently.
  windows-arm-installer:
    needs: changes
    if: ${{ github.event.repository.private == false && needs.changes.outputs.windows == 'true' }}
    runs-on: windows-11-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Windows PowerShell 5.1 installer fixtures
        if: ${{ !cancelled() }}
        shell: powershell
        run: .\scripts\test_install.ps1
      - name: PowerShell 7 installer fixtures
        if: ${{ !cancelled() }}
        shell: pwsh
        run: .\scripts\test_install.ps1
      - name: Independent Windows PowerShell 5.1 installer probes
        if: ${{ !cancelled() }}
        shell: powershell
        run: powershell -NoProfile -File integration/release_fixtures/install_windows_probe.ps1
      - name: Independent PowerShell 7 installer probes
        if: ${{ !cancelled() }}
        shell: pwsh
        run: pwsh -NoProfile -File integration/release_fixtures/install_windows_probe.ps1
      # The last two steps, so a failure there never hides the installer steps.
      # Under the user profile, as the x64 job does: the runner's own TEMP is
      # outside it, with a different ACL.
      - name: Native Windows ARM64 notify, setup, CLI and ctxwatch tests under the user profile
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $env:TEMP = Join-Path $env:LOCALAPPDATA 'Temp'
          $env:TMP = $env:TEMP
          $null = New-Item -ItemType Directory -Force -Path $env:TEMP
          go test ./internal/notify ./internal/setup ./internal/cli ./internal/ctxwatch -count=1
      # Also under the user profile, for the same reason.
      - name: Native Windows ARM64 Codex wake-up adapter with a Go-built fake
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $env:TEMP = Join-Path $env:LOCALAPPDATA 'Temp'
          $env:TMP = $env:TEMP
          $null = New-Item -ItemType Directory -Force -Path $env:TEMP
          go test ./integration -run '^TestNotificationCodexFakeSubprocess$' -count=1
