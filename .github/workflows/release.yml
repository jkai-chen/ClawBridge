name: Release
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  # A tag on a commit that never reached main (a side branch, a fork's commit
  # pushed by mistake) must not build or publish anything.
  on-main:
    if: ${{ github.event.repository.private == false && github.repository == 'jkai-chen/ClawBridge' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require the tagged commit on main
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main || { echo "::error::$GITHUB_SHA is not an ancestor of origin/main"; exit 1; }
  checks:
    needs: on-main
    if: ${{ github.event.repository.private == false && github.repository == 'jkai-chen/ClawBridge' }}
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
  build:
    needs: [on-main, checks]
    if: ${{ github.event.repository.private == false && github.repository == 'jkai-chen/ClawBridge' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: false
      # The web UI is built in this same job, from the committed lockfile with
      # no install scripts, so the attested binaries embed this job's bundle
      # and no artifact crosses jobs (GUI-DESIGN 12.1, R1-T8). The bundle goes
      # to the gitignored internal/webui/dist/app, which build-release.sh's
      # clean-tree check does not count.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.20.0
      - name: Build the web UI bundle
        working-directory: web
        run: |
          npm ci --ignore-scripts
          npm run build
      # The embedded bundle must be the real one and must match the manifest
      # the build wrote; a placeholder fails here, before anything is built.
      - name: Require the real web UI bundle
        env:
          CLAWBRIDGE_REQUIRE_UI_BUNDLE: '1'
        run: go test -count=1 -run '^TestEmbeddedBundle$' ./internal/webui
      # A reachable vulnerability in the code or the Go standard library
      # fails the release before anything is built or published.
      - name: Check for reachable Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Build exact tagged source
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: bash scripts/build-release.sh "$RELEASE_TAG" "$RUNNER_TEMP/release-assets"
      # Every built binary carries the bundle: its entry script's name is in
      # the binary's embedded file table. (Binaries are searched, not run.)
      - name: Require the bundle in every binary
        run: |
          entry=$(grep -oE 'assets/index-[A-Za-z0-9_-]+\.js' internal/webui/dist/app/manifest.sha256 | head -1)
          [[ -n $entry ]] || { echo "::error::the bundle manifest names no entry script"; exit 1; }
          n=0
          for bin in "$RUNNER_TEMP"/release-assets/clawbridge_*; do
            [[ -f $bin ]] || continue
            grep -aqF "dist/app/$entry" "$bin" || { echo "::error::$(basename "$bin") does not embed the web UI bundle"; exit 1; }
            n=$((n + 1))
          done
          [[ $n -ge 1 ]] || { echo "::error::no binaries found to check"; exit 1; }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-assets
          path: ${{ runner.temp }}/release-assets/*
          if-no-files-found: error
          retention-days: 3
  publish:
    needs: [on-main, checks, build]
    if: ${{ github.event.repository.private == false && github.repository == 'jkai-chen/ClawBridge' }}
    # Required reviewers on this environment hold publication for a human
    # approval; see docs/design/releases.md for the one-time repository setting.
    environment: release
    runs-on: ubuntu-latest
    # The three two-platform image builds, pushes and attestations run after
    # the approval, besides the assets. The dispatcher agent's arm64 image
    # runs npm and its RUN steps under QEMU, many times slower than native;
    # 60 minutes leaves room for that on top of the server and agentd images
    # (cross-compiled, a few minutes each) without letting a hung build hold
    # the release environment for the default six hours.
    timeout-minutes: 60
    permissions:
      contents: write
      # The server, agentd and dispatcher agent images go to
      # ghcr.io/jkai-chen/clawbridge{,-agentd,-dispatcher-agent} with this
      # job's GITHUB_TOKEN; only this job may write packages.
      packages: write
      # Build provenance (G9-10): a keyless Sigstore certificate for this
      # workflow run signs one statement per asset and for the image,
      # recorded in GitHub's attestation store and the public transparency
      # log. Each image is attested on its own.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-assets
          path: ${{ runner.temp }}/release-assets
      # Checked again after the approval wait, against main as it is now.
      - name: Require the tagged commit on main
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main || { echo "::error::$GITHUB_SHA is not an ancestor of origin/main"; exit 1; }
      # The image tags move only while no release exists for this tag, draft
      # or published, checked before login and every push; publish-release.sh
      # refuses an existing release too. A run that failed before its draft
      # can be re-run: builds aren't byte-reproducible, so the re-run pushes
      # new digests, which the release then names, and the first ones stay
      # orphaned with their attestations.
      - name: Refuse an existing release before the image tag moves
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          existing=$(gh api --paginate 'repos/jkai-chen/ClawBridge/releases?per_page=100' --jq ".[] | select(.tag_name == \"$RELEASE_TAG\") | .id")
          [[ -z $existing ]] || { echo "::error::release $RELEASE_TAG already exists; its image tag is left alone"; exit 1; }
      # The binary's build time is the commit's, as build-release.sh stamps
      # it, so the image and the release binaries report the same; the image
      # is still its own build of that commit, not the binaries' bytes.
      - name: Stamp the image from the tagged commit
        id: stamp
        run: |
          echo "build_time=$(TZ=UTC0 git show -s --format=%cd --date=format-local:%Y-%m-%dT%H:%M:%SZ "$GITHUB_SHA")" >> "$GITHUB_OUTPUT"
          echo "epoch=$(git show -s --format=%ct "$GITHUB_SHA")" >> "$GITHUB_OUTPUT"
      # The dispatcher agent's arm64 stages RUN npm and rm, so that image
      # needs an arm64 emulator; the server and agentd images cross-compile
      # and need none. The binfmt image is pinned by index digest, as the
      # Dockerfiles' bases are, not left at :latest.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          image: docker.io/tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          platforms: arm64
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # One tag per release, never latest: deployments pin the digest.
      - name: Build and push the server image
        id: image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        env:
          SOURCE_DATE_EPOCH: ${{ steps.stamp.outputs.epoch }}
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/jkai-chen/clawbridge:${{ github.ref_name }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            BUILD_TIME=${{ steps.stamp.outputs.build_time }}
          labels: |
            org.opencontainers.image.source=https://github.com/jkai-chen/ClawBridge
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          # Provenance comes from attest-build-provenance below, one
          # mechanism for the image and the assets; the SBOM stays with the
          # image.
          provenance: false
          sbom: true
      - name: Attest the server image's build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/jkai-chen/clawbridge
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
      # agentd's image, which is also the egress container's: agentd starts
      # `clawbridge-agentd egress` from it. Built the same way as the server
      # image; its Dockerfile declares no build args, so none are passed.
      - name: Build and push the agentd (egress) image
        id: agentd-image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        env:
          SOURCE_DATE_EPOCH: ${{ steps.stamp.outputs.epoch }}
        with:
          context: .
          file: cmd/clawbridge-agentd/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/jkai-chen/clawbridge-agentd:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=https://github.com/jkai-chen/ClawBridge
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          provenance: false
          sbom: true
      - name: Attest the agentd image's build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/jkai-chen/clawbridge-agentd
          subject-digest: ${{ steps.agentd-image.outputs.digest }}
          push-to-registry: true
      # The dispatcher agent's image, from its own directory (its Dockerfile
      # copies only that tree). No build args, as above.
      - name: Build and push the dispatcher agent image
        id: agent-image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        env:
          SOURCE_DATE_EPOCH: ${{ steps.stamp.outputs.epoch }}
        with:
          context: dispatcher-agent
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/jkai-chen/clawbridge-dispatcher-agent:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=https://github.com/jkai-chen/ClawBridge
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          provenance: false
          sbom: true
      - name: Attest the dispatcher agent image's build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/jkai-chen/clawbridge-dispatcher-agent
          subject-digest: ${{ steps.agent-image.outputs.digest }}
          push-to-registry: true
      # The digests become assets, in SHA256SUMS and attested with the
      # others, before anything is public: a deploy pins all three images
      # from the release.
      - name: Record the image digests as assets
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          AGENTD_IMAGE_DIGEST: ${{ steps.agentd-image.outputs.digest }}
          AGENT_IMAGE_DIGEST: ${{ steps.agent-image.outputs.digest }}
        run: |
          for digest in "$IMAGE_DIGEST" "$AGENTD_IMAGE_DIGEST" "$AGENT_IMAGE_DIGEST"; do
            [[ $digest =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::unexpected image digest"; exit 1; }
          done
          cd "$RUNNER_TEMP/release-assets"
          printf 'ghcr.io/jkai-chen/clawbridge@%s\n' "$IMAGE_DIGEST" > IMAGE-DIGEST.txt
          printf 'ghcr.io/jkai-chen/clawbridge-agentd@%s\n' "$AGENTD_IMAGE_DIGEST" > AGENTD-IMAGE-DIGEST.txt
          printf 'ghcr.io/jkai-chen/clawbridge-dispatcher-agent@%s\n' "$AGENT_IMAGE_DIGEST" > AGENT-IMAGE-DIGEST.txt
          sha256sum IMAGE-DIGEST.txt AGENTD-IMAGE-DIGEST.txt AGENT-IMAGE-DIGEST.txt >> SHA256SUMS
      # Attested before publication, so no published asset is ever without
      # its provenance. `gh attestation verify ASSET --repo
      # jkai-chen/ClawBridge` checks one, and the installers do with
      # CLAWBRIDGE_VERIFY=required.
      # Its Sigstore bundle (bundle-path) is published as the asset
      # PROVENANCE.sigstore.json, so a client verifies an asset with no API
      # call and no token (FR24); publish-release.sh checks it attests
      # exactly these assets.
      - name: Attest the build provenance of every asset
        id: attest-assets
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/release-assets/*
      - name: Draft, upload, verify downloaded bytes, then publish or hold
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          AGENTD_IMAGE_DIGEST: ${{ steps.agentd-image.outputs.digest }}
          AGENT_IMAGE_DIGEST: ${{ steps.agent-image.outputs.digest }}
          PROVENANCE_BUNDLE: ${{ steps.attest-assets.outputs.bundle-path }}
          # true stops at the verified draft, for publish-draft.yml to publish
          # later (docs/design/releases.md); unset or false publishes now.
          RELEASE_HOLD_DRAFT: ${{ vars.RELEASE_HOLD_DRAFT }}
        run: bash scripts/publish-release.sh "$RELEASE_TAG" "$RUNNER_TEMP/release-assets"
