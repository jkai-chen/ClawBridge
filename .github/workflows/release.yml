name: Release
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  checks:
    if: ${{ github.event.repository.private == false && github.repository == 'jkai-chen/ClawBridge' }}
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
  build:
    needs: checks
    if: ${{ github.event.repository.private == false && github.repository == 'jkai-chen/ClawBridge' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Build exact tagged source
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: bash scripts/build-release.sh "$RELEASE_TAG" "$RUNNER_TEMP/release-assets"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-assets
          path: ${{ runner.temp }}/release-assets/*
          if-no-files-found: error
          retention-days: 3
  publish:
    needs: [checks, build]
    if: ${{ github.event.repository.private == false && github.repository == 'jkai-chen/ClawBridge' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-assets
          path: ${{ runner.temp }}/release-assets
      - name: Draft, upload, verify downloaded bytes, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: bash scripts/publish-release.sh "$RELEASE_TAG" "$RUNNER_TEMP/release-assets"
