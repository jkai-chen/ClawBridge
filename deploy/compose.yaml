services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: clawbridge
      POSTGRES_USER: clawbridge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a private random database password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -h 127.0.0.1 -U clawbridge -d clawbridge"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
  api:
    build:
      context: ..
    command:
      - serve
      - --listen
      - 0.0.0.0:8080
      - --audience
      - ${CLAWBRIDGE_AUDIENCE:?Select the service-specific Google ID-token audience}
      - --bootstrap-owner
      - ${CLAWBRIDGE_BOOTSTRAP_OWNER:?Select the verified bootstrap principal}
    environment:
      CLAWBRIDGE_DATABASE_URL: postgres://clawbridge:${POSTGRES_PASSWORD:?Set a private random database password}@db:5432/clawbridge?sslmode=disable
    ports:
      - 127.0.0.1:8080:8080
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
volumes:
  postgres-data:
