# Pinned by digest, tag kept for reading; refresh: docs/operations/deployment.md, "Refreshing the base image digests".
services:
  db:
    image: postgres:17-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
    environment:
      POSTGRES_DB: clawbridge
      POSTGRES_USER: clawbridge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a private random database password}
    volumes:
      - ${CLAWBRIDGE_POSTGRES_DATA_PATH:-postgres-data}:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -h 127.0.0.1 -U clawbridge -d clawbridge"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - backend
    restart: unless-stopped

  api:
    build:
      context: ..
    command:
      - serve
      - --listen
      - 0.0.0.0:8080
      # Sign-in methods: google (the default, and what an existing deployment
      # keeps), device, or google,device. With google, serve refuses to start
      # unless the audience and all four OAuth settings below are set.
      - --auth
      - ${CLAWBRIDGE_AUTH:-google}
      - --public-origin
      - https://${CLAWBRIDGE_DOMAIN:?Set the public DNS name for ClawBridge}
      - --audience
      - ${CLAWBRIDGE_AUDIENCE:-}
      - --bootstrap-owner
      - ${CLAWBRIDGE_BOOTSTRAP_OWNER:?Select the verified bootstrap principal}
      - --oauth-client-id
      - ${CLAWBRIDGE_OAUTH_CLIENT_ID:-}
      - --oauth-device-client-id
      - ${CLAWBRIDGE_OAUTH_DEVICE_CLIENT_ID:-}
    environment:
      # Read by `operator bootstrap-invite`.
      CLAWBRIDGE_BOOTSTRAP_OWNER: ${CLAWBRIDGE_BOOTSTRAP_OWNER:?Select the verified bootstrap principal}
      CLAWBRIDGE_DATABASE_URL: postgres://clawbridge:${POSTGRES_PASSWORD:?Set a private random database password}@db:5432/clawbridge?sslmode=disable
      CLAWBRIDGE_OAUTH_CLIENT_SECRET: ${CLAWBRIDGE_OAUTH_CLIENT_SECRET:-}
      CLAWBRIDGE_OAUTH_DEVICE_CLIENT_SECRET: ${CLAWBRIDGE_OAUTH_DEVICE_CLIENT_SECRET:-}
      # Optional: the ClawBridge Linear app (docs/operations/deployment.md).
      # Left empty, the server starts without app writes.
      CLAWBRIDGE_LINEAR_APP_CLIENT_ID: ${CLAWBRIDGE_LINEAR_APP_CLIENT_ID:-}
      CLAWBRIDGE_LINEAR_APP_CLIENT_SECRET: ${CLAWBRIDGE_LINEAR_APP_CLIENT_SECRET:-}
      CLAWBRIDGE_LINEAR_APP_TOKEN_KEY: ${CLAWBRIDGE_LINEAR_APP_TOKEN_KEY:-}
      # Optional: the Linear webhooks' signing secrets, TEAM_UUID=SECRET,
      # comma-separated, at most 2 per team; needs the Linear app.
      CLAWBRIDGE_LINEAR_WEBHOOK_SECRETS: ${CLAWBRIDGE_LINEAR_WEBHOOK_SECRETS:-}
      # The server's own watcher (v0.3; docs/operations/deployment.md): off unless an
      # interval or the scheduler tick settings are set, and the Linear app
      # is configured.
      CLAWBRIDGE_WATCH_INTERVAL: ${CLAWBRIDGE_WATCH_INTERVAL:-}
      # Linear calls per hour each project may make, agent writes included,
      # 1-600; empty is 600. CLAWBRIDGE_WATCH_BUDGET is its old name.
      CLAWBRIDGE_LINEAR_BUDGET: ${CLAWBRIDGE_LINEAR_BUDGET:-}
      CLAWBRIDGE_WATCH_BUDGET: ${CLAWBRIDGE_WATCH_BUDGET:-}
      # How far a project owner may raise it, up to 5000; empty is 2000.
      CLAWBRIDGE_LINEAR_BUDGET_MAX: ${CLAWBRIDGE_LINEAR_BUDGET_MAX:-}
      CLAWBRIDGE_TICK_AUDIENCE: ${CLAWBRIDGE_TICK_AUDIENCE:-}
      CLAWBRIDGE_TICK_SERVICE_ACCOUNT: ${CLAWBRIDGE_TICK_SERVICE_ACCOUNT:-}
      # Gates the operator sets only after their live checks pass
      # (docs/operations/deployment.md): 1 turns one on; empty or 0 leaves it off.
      CLAWBRIDGE_PROJECT_FLOW_PROVEN: ${CLAWBRIDGE_PROJECT_FLOW_PROVEN:-}
      CLAWBRIDGE_ISSUE_SUBSCRIBERS_PROVEN: ${CLAWBRIDGE_ISSUE_SUBSCRIBERS_PROVEN:-}
      CLAWBRIDGE_ISSUE_MOVE_PROVEN: ${CLAWBRIDGE_ISSUE_MOVE_PROVEN:-}
      CLAWBRIDGE_PROJECT_TEAM_ADD_PROVEN: ${CLAWBRIDGE_PROJECT_TEAM_ADD_PROVEN:-}
      CLAWBRIDGE_PROJECT_STATUS_DOMAIN_PROVEN: ${CLAWBRIDGE_PROJECT_STATUS_DOMAIN_PROVEN:-}
      CLAWBRIDGE_PROJECT_PLAN_PROVEN: ${CLAWBRIDGE_PROJECT_PLAN_PROVEN:-}
      CLAWBRIDGE_ISSUE_FAMILY_MOVE_PROVEN: ${CLAWBRIDGE_ISSUE_FAMILY_MOVE_PROVEN:-}
      CLAWBRIDGE_WEBHOOKS_PROVEN: ${CLAWBRIDGE_WEBHOOKS_PROVEN:-}
      # Optional: the dispatcher model's key seal and agent cap
      # (docs/operations/deployment.md). Without the seal key, model setup
      # is off.
      CLAWBRIDGE_MODEL_KEY_SEAL_KEY: ${CLAWBRIDGE_MODEL_KEY_SEAL_KEY:-}
      CLAWBRIDGE_MODEL_KEY_SEAL_KEY_PREVIOUS: ${CLAWBRIDGE_MODEL_KEY_SEAL_KEY_PREVIOUS:-}
      CLAWBRIDGE_DISPATCHER_MODEL_MAX_AGENTS: ${CLAWBRIDGE_DISPATCHER_MODEL_MAX_AGENTS:-}
      # The reverse proxies whose X-Forwarded-For and X-Forwarded-Proto
      # count: IPs, CIDRs or host names, comma-separated. The default is
      # the caddy service below by its backend-only name; any other peer's
      # forwarded headers are ignored.
      CLAWBRIDGE_TRUSTED_PROXIES: ${CLAWBRIDGE_TRUSTED_PROXIES:-caddy-backend}
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # api and caddy share two networks, and Docker's DNS answers a shared
    # name with one network's address only. The -backend names exist on
    # backend alone, so Caddy always reaches the API over backend, from the
    # address caddy-backend resolves to: the one the API trusts.
    networks:
      backend:
        aliases: [api-backend]
      egress: {}
    restart: unless-stopped
    # serve waits up to 75 s for in-flight requests on SIGTERM (an app write
    # to Linear); compose must not kill it first. A drained server
    # (operator maintenance start --wait) stops at once.
    stop_grace_period: 90s

  caddy:
    image: caddy:2.10-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    command:
      - caddy
      - reverse-proxy
      - --from
      - ${CLAWBRIDGE_DOMAIN:?Set the public DNS name for ClawBridge}
      - --to
      - api-backend:8080
      - --disable-redirects
    ports:
      - 443:443
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_started
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    networks:
      backend:
        aliases: [caddy-backend]
      egress: {}
    restart: unless-stopped

networks:
  backend:
    internal: true
  egress:

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
